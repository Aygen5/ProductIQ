name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: productiq_test_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore backend/ProductIQ.slnx

      - name: Build Solution
        run: dotnet build backend/ProductIQ.slnx --configuration Release --no-restore

      - name: Run Backend Unit Tests
        run: dotnet test backend/tests/ProductIQ.UnitTests/ProductIQ.UnitTests.csproj --configuration Release --no-build --verbosity normal

      - name: Run Backend Integration Tests
        run: dotnet test backend/tests/ProductIQ.IntegrationTests/ProductIQ.IntegrationTests.csproj --configuration Release --no-build --verbosity normal
        env:
          ConnectionStrings__DefaultConnection: Host=127.0.0.1;Port=5433;Database=productiq_test_db;Username=postgres;Password=postgres;SSL Mode=Disable;Trust Server Certificate=true
          Jwt__Key: ${{ secrets.JWT_KEY || 'ProductIQ_SuperSecret_Jwt_SigningKey_2026_Development_Min32Chars!' }}

  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

      - name: Run Frontend Tests
        run: npm run test

  docker:
    name: Docker Compose Build Verification
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Environment Template
        run: cp .env.example .env

      - name: Build Docker Images
        run: docker compose build
        env:
          JWT_KEY: ${{ secrets.JWT_KEY || 'ProductIQ_SuperSecret_Jwt_SigningKey_2026_Development_Min32Chars!' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || '' }}
